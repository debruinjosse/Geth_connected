<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GETH Connected — Create account</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone-frame">
  <div class="phone-screen">

    <div class="dynamic-island"></div>

    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <span class="status-bar__icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="0.5" fill="currentColor"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5C6.5 10.5 5.1 9.9 4 8.9L4.9 7.9C5.8 8.7 6.9 9.1 8 9.1C9.1 9.1 10.2 8.7 11.1 7.9L12 8.9C10.9 9.9 9.5 10.5 8 10.5ZM2.4 6.2L1.5 5.2C3.2 3.6 5.5 2.7 8 2.7C10.5 2.7 12.8 3.6 14.5 5.2L13.6 6.2C12.1 4.8 10.1 4.1 8 4.1C5.9 4.1 3.9 4.8 2.4 6.2Z" fill="currentColor"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="2.5" stroke="currentColor" stroke-opacity="0.5"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="currentColor"/><rect x="22" y="4" width="1.5" height="4" rx="0.75" fill="currentColor" fill-opacity="0.5"/></svg>
      </span>
    </div>

    <div class="screen-content">

      <div class="brand-mark">
        <img src="../public/assets/geth-crest-mark.png" alt="GETH">
      </div>

      <div class="auth-copy">
        <p class="eyebrow">Employee onboarding</p>
        <h1 class="auth-title">Create your GETH&reg; account</h1>
        <p class="auth-subtitle">Employees and managers usually join through a company invitation so their team and role are assigned correctly.</p>
      </div>

      <form id="signup-form" novalidate>

        <div class="field-group">
          <label class="field-label" for="first-name">First name</label>
          <div class="field-input-wrap">
            <input class="field-input" type="text" id="first-name" name="first-name" placeholder="Sarah" autocomplete="given-name">
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="last-name">Last name</label>
          <div class="field-input-wrap">
            <input class="field-input" type="text" id="last-name" name="last-name" placeholder="van den Berg" autocomplete="family-name">
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="email">Email</label>
          <div class="field-input-wrap">
            <input class="field-input" type="email" id="email" name="email" placeholder="you@geth-demo.com" autocomplete="username">
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="password">Password</label>
          <div class="field-input-wrap">
            <input class="field-input has-toggle" type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password">
            <button class="field-toggle" type="button" id="password-toggle" aria-label="Show password" aria-pressed="false">
              <svg id="eye-icon" width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
          </div>
        </div>

        <button class="btn-primary" type="submit">Create account</button>
      </form>

      <div class="link-row">
        <a class="text-link" href="login.html">Already have an account? Sign in</a>
      </div>

    </div>

  </div>
</div>

<p class="mockup-caption">Screen 13 of 16 — Sign up. Already invited? <a href="login.html">Sign in</a> or <a href="invite-onboarding.html">accept an invitation</a>.</p>

<script>
  document.getElementById('signup-form').addEventListener('submit', (e) => e.preventDefault());

  const toggle = document.getElementById('password-toggle');
  const passwordInput = document.getElementById('password');
  toggle.addEventListener('click', () => {
    const showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    toggle.setAttribute('aria-pressed', String(!showing));
    toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    document.getElementById('eye-icon').innerHTML = showing
      ? '<path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/>'
      : '<path d="M2 2l16 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M1.5 10S4.5 4 10 4c1.1 0 2.1.18 3 .5M18.5 10s-1.2 2.4-3.6 4.1M7.6 12.4A2.5 2.5 0 0 1 9.9 7.6" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>';
  });
</script>

</body>
</html>
