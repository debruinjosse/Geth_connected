<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GETH Connected — Create a new password</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone-frame">
  <div class="phone-screen" data-state="default" id="screen">

    <div class="dynamic-island"></div>

    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <span class="status-bar__icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="0.5" fill="currentColor"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5C6.5 10.5 5.1 9.9 4 8.9L4.9 7.9C5.8 8.7 6.9 9.1 8 9.1C9.1 9.1 10.2 8.7 11.1 7.9L12 8.9C10.9 9.9 9.5 10.5 8 10.5ZM2.4 6.2L1.5 5.2C3.2 3.6 5.5 2.7 8 2.7C10.5 2.7 12.8 3.6 14.5 5.2L13.6 6.2C12.1 4.8 10.1 4.1 8 4.1C5.9 4.1 3.9 4.8 2.4 6.2Z" fill="currentColor"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="2.5" stroke="currentColor" stroke-opacity="0.5"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="currentColor"/><rect x="22" y="4" width="1.5" height="4" rx="0.75" fill="currentColor" fill-opacity="0.5"/></svg>
      </span>
    </div>

    <div class="screen-content">

      <div class="brand-mark">
        <img src="../public/assets/geth-crest-mark.png" alt="GETH">
      </div>

      <div class="auth-copy">
        <h1 class="auth-title">Create a new password</h1>
        <p class="auth-subtitle">Choose a new password to finish resetting your account.</p>
      </div>

      <form id="reset-form" novalidate>

        <div class="field-group" id="new-password-group">
          <label class="field-label" for="new-password">New password</label>
          <div class="field-input-wrap">
            <input class="field-input has-toggle" type="password" id="new-password" name="new-password" placeholder="Enter a new password" autocomplete="new-password">
            <button class="field-toggle" type="button" id="new-password-toggle" aria-label="Show password" aria-pressed="false">
              <svg class="eye-icon" width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
          </div>
        </div>

        <div class="field-group" id="confirm-password-group">
          <label class="field-label" for="confirm-password">Confirm password</label>
          <div class="field-input-wrap">
            <input class="field-input has-toggle" type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your new password" autocomplete="new-password">
            <button class="field-toggle" type="button" id="confirm-password-toggle" aria-label="Show password" aria-pressed="false">
              <svg class="eye-icon" width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
          </div>
          <p class="field-error-msg" id="confirm-password-error">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.4"/><path d="M10 6v5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10" cy="13.5" r="0.9" fill="currentColor"/></svg>
            Passwords don't match.
          </p>
        </div>

        <button class="btn-primary" type="submit">Update password</button>
      </form>

      <div class="success-panel">
        <div class="success-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 7" stroke="var(--gold-deep)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <p><strong>Password updated.</strong><br>You can sign in now.</p>
        <a class="text-link" href="login.html">Back to login</a>
      </div>

    </div>
  </div>
</div>

<div class="review-strip" aria-label="Mockup state switcher (not part of the app UI)">
  <span class="review-strip__label">Preview state</span>
  <button type="button" class="is-active" data-set-state="default">Default</button>
  <button type="button" data-set-state="error">Mismatch error</button>
  <button type="button" data-set-state="success">Success</button>
</div>
<p class="mockup-caption">Screen 3 of 3 — Reset password. Back to <a href="login.html">Login</a></p>

<script>
  const screen = document.getElementById('screen');
  const strip = document.querySelector('.review-strip');
  const confirmGroup = document.getElementById('confirm-password-group');
  const newPasswordInput = document.getElementById('new-password');
  const confirmPasswordInput = document.getElementById('confirm-password');

  function setState(state) {
    screen.dataset.state = state === 'success' ? 'success' : 'default';
    confirmGroup.classList.toggle('has-error', state === 'error');
    strip.querySelectorAll('button').forEach(b => b.classList.toggle('is-active', b.dataset.setState === state));
  }

  strip.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.setState === 'error') {
        newPasswordInput.value = newPasswordInput.value || 'NewPassword1!';
        confirmPasswordInput.value = 'DifferentPassword2!';
      }
      setState(b.dataset.setState);
    });
  });

  document.getElementById('reset-form').addEventListener('submit', (e) => {
    e.preventDefault();
    if (newPasswordInput.value !== confirmPasswordInput.value || newPasswordInput.value === '') {
      setState('error');
    } else {
      setState('success');
    }
  });

  function wireToggle(toggleId, inputId) {
    const toggle = document.getElementById(toggleId);
    const input = document.getElementById(inputId);
    toggle.addEventListener('click', () => {
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      toggle.setAttribute('aria-pressed', String(!showing));
      toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      toggle.querySelector('.eye-icon').innerHTML = showing
        ? '<path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/>'
        : '<path d="M2 2l16 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M1.5 10S4.5 4 10 4c1.1 0 2.1.18 3 .5M18.5 10s-1.2 2.4-3.6 4.1M7.6 12.4A2.5 2.5 0 0 1 9.9 7.6" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>';
    });
  }
  wireToggle('new-password-toggle', 'new-password');
  wireToggle('confirm-password-toggle', 'confirm-password');
</script>

</body>
</html>
